<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sverige</title>
<meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sverige">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#FAF8F5; --card:#FFFFFF; --soft:#F2EFEA; --ink:#2B2B30; --ink2:#6E6E78; --line:#ECE8E2;
  --accent:#5C7FA8; --accent-bg:#E3ECF6; --ok:#5E8C6A; --ok-bg:#E1EEE4; --danger:#B4555A;
  --blue:#E3ECF6; --blue-t:#3F5F86; --lav:#ECE7F6; --lav-t:#5E528F; --peach:#FAE7DC; --peach-t:#9A5B3A;
  --sage:#E1EEE4; --sage-t:#3F6B4E; --butter:#F7F0D6; --butter-t:#7A6626; --pink:#F7E1E8; --pink-t:#8E4560;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1C1C1F; --card:#26262A; --soft:#303036; --ink:#EDEDF0; --ink2:#A2A2AC; --line:#34343A;
    --accent:#9DB9DA; --accent-bg:#2E3A48; --ok:#9CC5A6; --ok-bg:#2C3A31; --danger:#E08C90;
    --blue:#2E3A48; --blue-t:#B5CBE6; --lav:#36324A; --lav-t:#C9C0EA; --peach:#4A372E; --peach-t:#F0C3A8;
    --sage:#2C3A31; --sage-t:#B4D6BD; --butter:#433D29; --butter-t:#E6D79C; --pink:#45303A; --pink-t:#EDB7C8;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
svg.i{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--safe-t) + 10px) 18px 10px;border-bottom:1px solid transparent}
header.scrolled{border-bottom-color:var(--line)}
.hrow{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.hrow h1{font-size:24px;flex:1}
.back{display:none;align-items:center;gap:2px;background:none;border:0;color:var(--accent);padding:6px 6px 6px 0;font-size:16px}
.back.on{display:flex}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.status{max-width:640px;margin:4px auto 0;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:#D9B26A}.dot.ok{background:var(--ok)}

main{padding:8px 16px calc(var(--safe-b) + 92px);max-width:640px;margin:0 auto}
.section-t{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:22px 4px 8px;display:flex;align-items:center;gap:8px}
.section-t .grow{flex:1}
.section-t button{text-transform:none;letter-spacing:0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list>.row:last-child,.list>div:last-child>.row{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:16px}
.row .s{font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--ink2)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.c-Sight{background:var(--blue);color:var(--blue-t)} .c-Museum{background:var(--lav);color:var(--lav-t)}
.c-Fika{background:var(--peach);color:var(--peach-t)} .c-Nature{background:var(--sage);color:var(--sage-t)}
.c-Village{background:var(--butter);color:var(--butter-t)} .c-Experience{background:var(--pink);color:var(--pink-t)}
.c-Mine{background:var(--accent-bg);color:var(--accent)}
.swatch{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:15px;flex:0 0 auto}

.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.soft{background:var(--accent-bg);color:var(--accent)}
.btn.plain{background:var(--soft);color:var(--ink)}
.btn.danger{background:none;color:var(--danger)}
.btn.full{width:100%}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.textbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
.btnrow{display:flex;gap:8px}
.btnrow>*{flex:1}

input[type=text],input[type=date],input[type=search],input[type=time],textarea,select{width:100%;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--card)}
textarea{min-height:88px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--ink2);font-weight:500;margin:12px 0 5px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.searchbox input{padding-left:38px}

.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin:4px 0 6px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px -16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* day overview */
.daynum{width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto;line-height:1}
.daynum b{font-size:17px}.daynum span{font-size:10px;margin-top:2px;opacity:.8;text-transform:uppercase}
.bar{height:4px;border-radius:4px;background:var(--soft);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.order{display:flex;flex-direction:column;gap:2px}
.order button{background:none;border:0;color:var(--ink2);padding:0 2px;height:18px;display:grid;place-items:center}
.order button:disabled{opacity:.25}

/* day detail */
.hero{border-radius:var(--r);padding:18px;margin-bottom:10px}
.hero h2{font-size:24px;line-height:1.2;margin:4px 0 6px}
.hero p{margin:0;font-size:15px}
.hero .eyebrow{font-size:13px;font-weight:600;opacity:.85}
.stop{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.stop:last-child{border-bottom:0}
.chk{flex:0 0 26px;height:26px;border-radius:50%;border:1.8px solid var(--line);background:var(--card);display:grid;place-items:center;color:#fff;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.stop .time{font-size:12px;font-weight:600;color:var(--accent)}
.stop .t{font-weight:600}
.stop .d{font-size:14px;color:var(--ink2);margin-top:2px}
.stop.done .t{color:var(--ink2);text-decoration:line-through}
.stop.hidden{opacity:.45}
.stop .ctl{display:flex;gap:4px;margin-left:auto}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--ink2);font-size:13px;font-weight:600;padding-top:2px}
.kv dd{margin:0 0 8px}

.phrase{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase .say{font-size:13px;color:var(--ink2)}
.phrase .en{color:var(--ink2);font-size:14px;text-align:right}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:6px 8px calc(var(--safe-b) + 6px);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);font-size:11px;font-weight:500;padding:4px 0}
nav button svg.i{width:23px;height:23px}
nav button.on{color:var(--accent)}

.sheet-bg{position:fixed;inset:0;background:rgba(20,20,25,.3);z-index:20;display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:640px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 18px calc(var(--safe-b) + 18px);max-height:88vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:21px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.on{opacity:1}
.empty{text-align:center;padding:22px 12px;color:var(--ink2);font-size:15px}
.hint{background:var(--accent-bg);color:var(--accent);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
mark{background:var(--butter);color:inherit;border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<header id="hdr">
  <div class="hrow">
    <button class="back" id="backBtn"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span id="backTxt">Back</span></button>
    <h1 id="title">Sverige</h1>
    <button class="iconbtn" id="searchBtn" aria-label="Search everything"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </div>
  <div class="status"><span class="dot" id="offDot"></span><span id="offTxt">Preparing offline copy</span></div>
</header>

<main id="main"></main>

<nav>
  <button data-tab="plan"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="places"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Places</button>
  <button data-tab="guide"><svg class="i" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Guide</button>
  <button data-tab="mine"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>My trip</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
