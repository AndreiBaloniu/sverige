<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mysig Sverige</title>
<meta name="theme-color" content="#F4ECDF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sverige">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --paper:#F4ECDF; --card:#FBF6EE; --card2:#F0E5D4; --ink:#3A2E26; --ink2:#7A6656;
  --red:#9A3324; --pine:#33473C; --amber:#D9963F; --line:#E2D4BF; --shadow:0 1px 0 rgba(58,46,38,.04),0 6px 18px rgba(58,46,38,.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
[data-theme="evening"]{
  --paper:#1E1915; --card:#2A231D; --card2:#342B23; --ink:#F1E6D6; --ink2:#B9A58F;
  --red:#E07A5F; --pine:#9DBBA4; --amber:#F2B35E; --line:#3D3229; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{min-height:100vh;background-image:radial-gradient(rgba(120,90,60,.05) 1px,transparent 1px);background-size:4px 4px}
[data-theme="evening"] body{background-image:radial-gradient(circle at 50% -10%,rgba(242,179,94,.13),transparent 55%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}

header{position:sticky;top:0;z-index:5;padding:calc(var(--safe-t) + 12px) 20px 10px;background:linear-gradient(var(--paper) 75%,transparent)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:26px}
.brand small{display:block;font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:14px;margin-top:-2px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px}
.status{font-size:12px;color:var(--ink2);margin-top:6px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.dot.ok{background:var(--pine)}

.flame{transform-origin:50% 100%;animation:flick 3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(.96,1.05) rotate(-2deg)}50%{transform:scale(1.03,.97) rotate(1deg)}75%{transform:scale(.98,1.03) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.flame{animation:none}}

main{padding:4px 16px calc(var(--safe-b) + 96px);max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--ink2)}
.serif{font-family:var(--serif)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.pill.red{background:transparent;color:var(--red);border-color:currentColor}

/* Day strip */
.daystrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding:0 16px;scrollbar-width:none;scroll-snap-type:x proximity}
.daystrip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;scroll-snap-align:start;min-width:58px;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:center}
.dchip b{display:block;font-family:var(--serif);font-size:20px;line-height:1.1}
.dchip span{font-size:11px;color:var(--ink2)}
.dchip.on{background:var(--red);border-color:var(--red);color:#FFF8EE}
.dchip.on span{color:#FFE9D6}
.dchip.done:not(.on){border-color:var(--pine)}
.dchip.today:not(.on){box-shadow:inset 0 0 0 2px var(--amber)}

.dayhead h2{font-size:28px;line-height:1.15;margin:4px 0 6px}
.progress{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin:12px 0 2px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--red));border-radius:9px;transition:width .3s}

.tl{position:relative;margin-top:6px}
.tl:before{content:"";position:absolute;left:15px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.stop{position:relative;display:flex;gap:12px;padding:10px 0}
.chk{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;z-index:1;transition:.2s}
.chk.on{background:var(--pine);border-color:var(--pine);color:#fff}
.stop .time{font-size:12px;color:var(--amber);font-weight:600;letter-spacing:.03em}
.stop h3{font-size:18px;margin:1px 0 3px}
.stop p{margin:0;font-size:15px;color:var(--ink2)}
.stop.done h3{text-decoration:line-through;text-decoration-color:var(--ink2);opacity:.7}
.linkbtn{background:none;border:0;padding:4px 0 0;color:var(--red);font-size:13px;font-weight:600}

.tips{display:grid;gap:10px}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ic{flex:0 0 34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:17px}
.tip b{display:block;font-size:13px;color:var(--ink2);font-weight:600}
.tip div{font-size:15px}

textarea,input[type=text],input[type=date],input[type=search],select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
textarea{min-height:90px;resize:vertical;font-family:var(--serif);font-size:16px}
textarea:focus,input:focus,select:focus{border-color:var(--amber)}

/* Explore */
.filters{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 8px;padding:0 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:0 0 auto;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px}
.fbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.place{display:flex;gap:12px;align-items:flex-start}
.place .badge{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--card2)}
.place h3{font-size:18px}
.place .meta{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0}
.place p{margin:0;font-size:15px;color:var(--ink2)}
.heart{margin-left:auto;background:none;border:0;font-size:22px;padding:0 0 0 6px;color:var(--ink2)}
.heart.on{color:var(--red)}
.actions{display:flex;gap:14px;margin-top:6px}
.ext{border-left:3px solid var(--amber)}

/* Cozy */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card2);border-radius:14px;padding:12px}
.mini h3{font-size:17px}
.mini .say{font-size:12px;color:var(--amber);font-style:italic;margin:2px 0 4px}
.mini p{margin:0;font-size:14px;color:var(--ink2)}
.phrase{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.phrase:last-child{border:0}
.phrase b{font-family:var(--serif);font-size:17px;font-weight:600}
.phrase i{display:block;font-size:13px;color:var(--amber)}
.phrase span{color:var(--ink2);font-size:14px;text-align:right}
.trad{display:flex;gap:12px;padding:8px 0}
.trad b{flex:0 0 96px;font-family:var(--serif);color:var(--red)}
.trad span{font-size:15px}
.bigquote{font-family:var(--serif);font-size:21px;line-height:1.35;font-style:italic}

/* Notes */
.packitem{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.packitem:last-child{border:0}
.packitem .chk{flex-basis:26px;height:26px;font-size:13px}
.packitem.done span{text-decoration:line-through;color:var(--ink2)}
.packitem .x{margin-left:auto;background:none;border:0;color:var(--ink2);font-size:18px}
.row{display:flex;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--red);color:#FFF8EE;font-weight:600}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.entry{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.entry .when{font-size:12px;color:var(--amber);font-weight:600}
.entry p{font-family:var(--serif);margin:3px 0 0;white-space:pre-wrap}

/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:8px 8px calc(var(--safe-b) + 8px);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink2);font-size:11px;padding:4px 0}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--red)}
nav button em{font-style:normal;font-family:var(--serif);font-size:10px;opacity:.75}

.sheet-bg{position:fixed;inset:0;background:rgba(30,20,12,.35);z-index:20;display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:640px;margin:0 auto;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 18px calc(var(--safe-b) + 18px);max-height:85vh;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 86px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.empty{text-align:center;padding:24px 10px;color:var(--ink2);font-family:var(--serif);font-style:italic}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">
      <svg width="34" height="40" viewBox="0 0 34 40" aria-hidden="true">
        <ellipse cx="17" cy="37" rx="13" ry="2.5" fill="currentColor" opacity=".1"/>
        <rect x="9" y="17" width="16" height="20" rx="3" fill="#EFE2C9" stroke="#C9B391"/>
        <path d="M17 17v-3" stroke="#3A2E26" stroke-width="1.4"/>
        <g class="flame"><path d="M17 2c3 4 5 6.5 5 9a5 5 0 0 1-10 0c0-2.5 2-5 5-9z" fill="#F2B35E"/><path d="M17 7c1.5 2 2.4 3.2 2.4 4.4a2.4 2.4 0 0 1-4.8 0C14.6 10.2 15.5 9 17 7z" fill="#FFF1C9"/></g>
      </svg>
      <div><h1>Mysig Sverige</h1><small id="subtitle">a cozy guide to Sweden</small></div>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle evening mode">🕯️</button>
  </div>
  <div class="status"><span class="dot" id="offDot"></span><span id="offTxt">Preparing offline copy…</span></div>
</header>

<main>
  <section class="view" id="v-trip"></section>
  <section class="view" id="v-explore"></section>
  <section class="view" id="v-cozy"></section>
  <section class="view" id="v-notes"></section>
</main>

<nav>
  <button data-tab="trip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>Trip<em>resan</em></button>
  <button data-tab="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Explore<em>upptäck</em></button>
  <button data-tab="cozy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h12v4a6 6 0 0 1-12 0z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3c0 2 2 2 2 4M12 3c0 2 2 2 2 4"/></svg>Cozy<em>fika</em></button>
  <button data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></svg>Notes<em>dagbok</em></button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
